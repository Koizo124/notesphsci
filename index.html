<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Valentine Surprise</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    height: 100%;
}

body {
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #ff758c, #ff7eb3);
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    color: white;
}

.container {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: rgba(0,0,0,0.3);
    padding: 30px;
    border-radius: 20px;
    backdrop-filter: blur(10px);
    max-width: 400px;
}

img {
    width: 150px;
    margin-bottom: 20px;
}

h1 {
    margin-bottom: 10px;
}

p#message {
    min-height: 30px;
    margin-bottom: 20px;
}

.buttons {
    display: flex;
    justify-content: center;
    gap: 10px;
}

button {
    padding: 10px 20px;
    border: none;
    border-radius: 25px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s ease;
    font-size: 16px;
}

#yesBtn {
    background: white;
    color: #ff4d6d;
}

#noBtn {
    background: #333;
    color: white;
}
</style>
</head>

<body>

<div class="container">
    <img src="cat.gif" alt="Cute Cat">
    <h1>Will you be my Valentine?</h1>
    <p id="message"></p>
    <div class="buttons">
        <button id="yesBtn" onclick="sayYes()">Yes</button>
        <button id="noBtn" onclick="sayNo()">No</button>
    </div>
</div>

<!-- Mobile-safe audio -->
<audio id="bgMusic" src="music.mp3" preload="auto" loop></audio>

<script>
let noClickCount = 0;

const messages = [
    "Are you sure?",
    "C'mon, Ambeng. :((.",
    "Pretty please? PLEASEE PRETTYY LADYY",
    "That hurts.",
    "Last chance.",
    "This is getting serious."
];

function sayNo() {
    const message = document.getElementById("message");
    const noBtn = document.getElementById("noBtn");
    const yesBtn = document.getElementById("yesBtn");

    if (noClickCount < messages.length) {
        message.textContent = messages[noClickCount];
    } else {
        message.textContent = "The only correct answer is yes.";
    }

    noClickCount++;

    // Shrink No button
    let noSize = 16 - (noClickCount * 2);
    if (noSize < 8) noSize = 8;
    noBtn.style.fontSize = noSize + "px";

    // Enlarge Yes button
    let yesSize = 16 + (noClickCount * 4);
    yesBtn.style.fontSize = yesSize + "px";
}

// Mobile-safe fade-in music
function fadeInMusic() {
    const music = document.getElementById("bgMusic");
    music.volume = 0;

    const playPromise = music.play();
    if (playPromise !== undefined) {
        playPromise.then(() => {
            // Music started successfully, fade in
            let volume = 0;
            const fadeInterval = setInterval(() => {
                if (volume < 1) {
                    volume += 0.05;
                    music.volume = volume;
                } else {
                    clearInterval(fadeInterval);
                }
            }, 200);
        }).catch(error => {
            console.log("Audio play failed:", error);
        });
    }
}

function sayYes() {
    fadeInMusic(); // Start fade-in music first

    // Slight delay before replacing body to ensure music starts
    setTimeout(() => {
        document.body.innerHTML = `
            <div style="
                display:flex;
                justify-content:center;
                align-items:center;
                height:100vh;
                background:linear-gradient(135deg,#ff758c,#ff7eb3);
                color:white;
                font-family:Arial;
                text-align:center;
                flex-direction:column;
            ">
                <h1>Thank you.</h1>
                <p>You just made me very happy.</p>
                <p>Happy Valentine's Day.</p>
            </div>
        `;
    }, 100);
}
</script>

</body>
</html>
